# Temporary: regenerate package-lock.json for @wyre-ai/node-threatlocker@2.0.0.
# GitHub Packages is not readable from the cloud-agent token. This workflow
# uses the repo GITHUB_TOKEN (same auth as CI) and uploads the lockfile.
# Delete this file once the lockfile commit lands.
name: Refresh SDK lockfile

on:
  push:
    branches:
      - cursor/audit-file-history-params-f08b

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install @wyre-ai/node-threatlocker@^2.0.0 and verify npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install @wyre-ai/node-threatlocker@^2.0.0
          node -p "require('./node_modules/@wyre-ai/node-threatlocker/package.json').version"
          rm -rf node_modules
          npm ci
          node -p "require('./node_modules/@wyre-ai/node-threatlocker/package.json').version"

      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
